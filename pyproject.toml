[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes defaults, I: import sorting,
# B: common bug patterns, UP: modern Python syntax.
select = ["E", "F", "I", "B", "UP"]
# FastAPI's `Depends(...)` in default arguments is the intended pattern.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Scaffold imports used by the TODO functions; remove once auth.py is implemented.
"app/auth.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
